name: Biome Lint

"on":
  push:
    paths:
      - 'orderlink-frontend/**'
  pull_request:
    paths:
      - 'orderlink-frontend/**'

jobs:
  lint:
    name: Run Biome Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./orderlink-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run Biome lint (non-blocking)
        continue-on-error: true
        run: bun run lint --reporter=github
